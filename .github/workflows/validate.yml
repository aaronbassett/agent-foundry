name: Validate Plugins

on:
  pull_request:
    branches: ['**']
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate plugins and marketplace
        run: bash scripts/ci/validate.sh

  smoke-rust-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select stable Rust toolchain
        run: rustup default stable && rustc --version

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Smoke test rust-core skill scripts and configs
        run: bash scripts/ci/smoke-rust-core.sh

  smoke-python-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Smoke test python-core skill scripts and configs
        run: bash scripts/ci/smoke-python-core.sh

  smoke-typescript-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Smoke test typescript-core templates and references
        run: bash scripts/ci/smoke-typescript-core.sh
