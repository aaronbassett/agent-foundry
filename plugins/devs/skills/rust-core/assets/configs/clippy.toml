# Clippy lint *configuration* (behavior knobs). Lint *levels* belong in
# Cargo.toml's [lints] table — see lints.toml in this directory.

# The lints.toml template denies clippy::unwrap_used / clippy::expect_used.
# These two settings exempt test code, where unwrap/expect are idiomatic —
# without them, every idiomatic test fails a -D warnings gauntlet.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Uncomment when the project declares an MSRV so clippy won't suggest newer APIs:
# msrv = "1.85"
