# cargo-deny configuration (schema: cargo-deny 0.18+; validate with `cargo deny check`)
# Hand-curated template — adjust the license allowlist to your project's policy.

[advisories]
# RUSTSEC advisories are denied by default in current cargo-deny.
# Add specific advisory IDs here only with a written justification:
ignore = [
    # "RUSTSEC-0000-0000",  # reason, link to issue
]

[licenses]
# Permissive licenses common across the crates.io dependency graph.
# Unicode-3.0 is required by unicode-ident (dependency of syn/proc-macro2).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# Don't lint licenses of this workspace's own unpublished (publish = false) crates.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Ban specific crates here, e.g.:
    # { crate = "openssl", reason = "use rustls", wrappers = ["native-tls"] }
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
